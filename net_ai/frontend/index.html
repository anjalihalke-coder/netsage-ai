<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A practical rule-based network troubleshooting assistant."><title>NetSage AI · Network Troubleshooting</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><div><h1>NetSage AI</h1><p>Network Troubleshooting Assistant</p></div><div class="toolbar"><span id="identity" class="muted"></span><button id="logout" class="secondary hidden">Sign out</button></div></header>
<main><section id="auth-panel" class="card"><h2 id="auth-title">Sign in</h2><form id="auth-form"><div id="name-field" class="hidden"><label for="name">Name</label><input id="name" name="name" autocomplete="name"></div><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="current-password"><input id="auth-action" name="action" type="hidden" value="login"><button id="auth-submit">Sign in</button></form><button id="auth-mode" class="secondary">Create an account</button><p class="muted">The first registered account is assigned reviewer access.</p></section>
<section id="app-panel" class="hidden"><div class="card"><h2>Describe a network issue</h2><form id="diagnosis-form"><label for="symptoms">Symptoms</label><textarea id="symptoms" name="symptoms" placeholder="Users cannot reach the internet; the uplink shows line protocol down"></textarea><label for="topology">Topology</label><textarea id="topology" name="topology" placeholder="PC → access switch → router → ISP"></textarea><label for="commandOutput">Cisco IOS output</label><textarea id="commandOutput" name="commandOutput" placeholder="Paste relevant show command output"></textarea><button>Analyze issue</button></form><div id="result" class="result hidden"></div><form id="upload-form"><label for="packetTracer">Optional Packet Tracer file (.pkt/.pka, up to 10 MB)</label><input id="packetTracer" name="packetTracer" type="file" accept=".pkt,.pka"><button class="secondary">Upload for reference</button></form></div><div class="card" style="margin-top:1rem"><h2>Recent diagnoses</h2><div id="history"><p class="muted">Sign in to view diagnoses.</p></div></div></section><section id="message" class="" aria-live="polite"></section></main>
<script src="/js/api.js"></script><script src="/js/app.js"></script></body></html>
